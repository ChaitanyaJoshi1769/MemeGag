{{- range .Values.services }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ $.Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .name }}
  template:
    metadata:
      labels:
        app: {{ .name }}
    spec:
      containers:
      - name: {{ .name }}
        image: "{{ $.Values.image.registry }}/{{ $.Values.image.repository }}-{{ .name }}:{{ $.Values.image.tag }}"
        imagePullPolicy: {{ $.Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .port }}
        env:
        {{- range $key, $value := $.Values.env }}
        - name: {{ $key | upper }}
          value: "{{ $value }}"
        {{- end }}
        resources:
          {{- toYaml $.Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .port }}
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .port }}
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: {{ .name }}
  ports:
  - protocol: TCP
    port: {{ .port }}
    targetPort: {{ .port }}
  type: ClusterIP
---
{{- end }}
