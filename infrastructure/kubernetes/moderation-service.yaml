apiVersion: apps/v1
kind: Deployment
metadata:
  name: moderation-service
  namespace: memegag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: moderation-service
  template:
    metadata:
      labels:
        app: moderation-service
    spec:
      containers:
      - name: moderation-service
        image: memegag-moderation-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3002
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: memegag-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: memegag-secrets
              key: database-url
        - name: MODERATION_ENABLED
          valueFrom:
            configMapKeyRef:
              name: memegag-config
              key: MODERATION_ENABLED
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3002
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3002
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: moderation-service
  namespace: memegag
spec:
  type: ClusterIP
  selector:
    app: moderation-service
  ports:
  - protocol: TCP
    port: 3002
    targetPort: 3002
    name: http
