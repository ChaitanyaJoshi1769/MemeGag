apiVersion: v1
kind: ConfigMap
metadata:
  name: memegag-config
  namespace: memegag
data:
  NODE_ENV: production
  LOG_LEVEL: info
  API_URL: https://api.memegag.com
  CORS_ORIGIN: https://memegag.com,https://www.memegag.com
  RATE_LIMIT_WINDOW: "900000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  STORAGE_PROVIDER: s3
  MODERATION_ENABLED: "true"
