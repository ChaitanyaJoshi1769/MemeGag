apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: memegag
spec:
  replicas: 2
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      containers:
      - name: search-service
        image: memegag-search-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3003
          name: http
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: memegag-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: memegag-secrets
              key: database-url
        - name: ELASTICSEARCH_HOST
          valueFrom:
            secretKeyRef:
              name: memegag-secrets
              key: elasticsearch-host
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3003
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: memegag
spec:
  type: ClusterIP
  selector:
    app: search-service
  ports:
  - protocol: TCP
    port: 3003
    targetPort: 3003
    name: http
