name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  REGISTRY_USERNAME: ${{ github.actor }}
  REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint code
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push'
    strategy:
      matrix:
        service:
          - api-gateway
          - feed-service
          - moderation-service
          - search-service
          - notification-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REGISTRY_USERNAME }}
          password: ${{ env.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: ./apps/${{ matrix.service }}
          file: ./apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/memegag-${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/memegag-${{ matrix.service }}:${{ github.sha }}

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update images
        run: |
          for service in api-gateway feed-service moderation-service search-service notification-service; do
            kubectl set image deployment/$service \
              $service=${{ env.REGISTRY }}/${{ github.repository }}/memegag-$service:${{ github.sha }} \
              -n memegag-staging
          done

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-gateway -n memegag-staging
          kubectl rollout status deployment/feed-service -n memegag-staging
          kubectl rollout status deployment/moderation-service -n memegag-staging
          kubectl rollout status deployment/search-service -n memegag-staging
          kubectl rollout status deployment/notification-service -n memegag-staging

      - name: Run smoke tests
        run: |
          kubectl port-forward -n memegag-staging svc/api-gateway 3000:80 &
          sleep 5
          curl -f http://localhost:3000/health || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure kubectl
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Update images
        run: |
          for service in api-gateway feed-service moderation-service search-service notification-service; do
            kubectl set image deployment/$service \
              $service=${{ env.REGISTRY }}/${{ github.repository }}/memegag-$service:${{ github.sha }} \
              -n memegag
          done

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api-gateway -n memegag --timeout=5m
          kubectl rollout status deployment/feed-service -n memegag --timeout=5m

      - name: Notify Slack
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK }}
          payload: |
            {
              "text": "✅ MemeGag deployed to production",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *MemeGag deployed to production*\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
